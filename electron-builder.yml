# Packaging configuration (https://www.electron.build/configuration)
appId: com.spritegen.desktop
productName: SpriteGen
copyright: Copyright © 2026 SpriteGen contributors
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
mac:
  category: public.app-category.graphics-design
  target:
    - dmg
    - zip
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  category: Graphics
  maintainer: SpriteGen contributors <noreply@example.com>
  target:
    - AppImage
    - deb
